<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study Buddy"><meta name="theme-color" content="#6c4cf1">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png">
<title>Study Buddy</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif;background:#fff8e7;color:#222;font-size:20px;line-height:1.5;padding:env(safe-area-inset-top) 12px 40px;-webkit-user-select:none;user-select:none}
#app{max-width:640px;margin:auto}
h1{color:#6c4cf1;text-align:center;font-size:32px}h2{margin:.2em 0}
.big{font-size:24px;text-align:center}.huge{font-size:30px;text-align:center;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{touch-action:manipulation;font:inherit;border:0;border-radius:18px;min-height:64px;cursor:pointer}
.day{background:#ffd23f;font-size:20px;padding:8px}.day.done{background:#7bd389}.day[disabled]{background:#ddd;color:#888}
.part,.ans,.go{display:block;width:100%;margin:10px 0;padding:14px;font-size:24px;background:#4cc9f0;color:#08263a}
.part.done{background:#7bd389}.part[disabled]{background:#ddd;color:#888}
.go{background:#6c4cf1;color:#fff;font-size:28px}
.small{display:block;width:100%;margin:10px 0;background:#e0d7ff;font-size:20px}.danger{background:#ffb3b3}
.card{background:#fff;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 3px 0 #0001}
.passage p{font-size:24px;line-height:1.7}
input,select{font:inherit;font-size:30px;width:100%;padding:10px;border-radius:14px;border:3px solid #6c4cf1;text-align:center;margin:6px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.key{font-size:30px;background:#ffd23f}
.top{display:flex;justify-content:space-between;font-size:22px;font-weight:bold}.err{color:#c00;text-align:center}
.gear{margin-top:30px;opacity:.8}
.ans.correct,input.correct{background:#7bd389!important;color:#0b3d17;outline:4px solid #2e9e4a}
.ans.wrong,input.wrong{background:#ff9b9b!important;color:#5a0000;outline:4px solid #d33}
.ans:disabled{opacity:1}.ans:disabled:not(.correct):not(.wrong){opacity:.55}
.fb{min-height:60px;text-align:center}.fb.right{color:#1d7a36}.fb.wrong{color:#a33}
.q{white-space:normal}.ctx{font-size:22px}.step{text-align:center;font-weight:bold;color:#6c4cf1}
label{display:block;margin:8px 0}summary{font-size:22px;cursor:pointer}.word small{color:#555}

.spbtn{display:block;width:100%;margin:10px 0;padding:14px;font-size:1.25rem;font-weight:700;border:3px dashed #7c5cff;border-radius:16px;background:#f4f0ff;color:#4b2fd1}
#pad{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overscroll-behavior:none}
#pad[hidden]{display:none}
#padq{margin:0;padding:8px 12px;font-size:1.1rem;font-weight:700;background:#fff7d6;border-bottom:2px solid #f0d97a;max-height:22vh;overflow:auto;white-space:pre-line}
#padbar{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:6px 8px;align-items:center;background:#f6f6fb;border-bottom:1px solid #ddd}
#padbar button{min-width:44px;min-height:44px;font-size:1.2rem;border:2px solid #ccc;border-radius:12px;background:#fff;padding:0 8px}
#padbar button.on{border-color:#4b2fd1;background:#ebe5ff}
#padbar button:disabled{opacity:.35}
#padbar .sw{width:44px;border-radius:50%}
#padtop{display:flex;align-items:flex-start;background:#fff7d6;border-bottom:2px solid #f0d97a}#padtop #padq{flex:1;border:0}#padtop .close{flex:none;margin:6px;min-height:44px;font-size:1.1rem;padding:0 12px;border-radius:12px;background:#ffe3e3;border:2px solid #f99;font-weight:700}
#padwrap{flex:1;position:relative;touch-action:none;background:#fff}
#padwrap.lined{background:repeating-linear-gradient(#fff 0 31px,#b9d3f5 31px 32px)}
#padwrap.grid{background-color:#fff;background-image:linear-gradient(#cfe0f7 1px,transparent 1px),linear-gradient(90deg,#cfe0f7 1px,transparent 1px);background-size:28px 28px}
#padc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#padtop .tipsbtn{flex:none;margin:6px 0 6px 6px;min-height:44px;font-size:1.1rem;padding:0 12px;border-radius:12px;background:#fff3b0;border:2px solid #e0b400;font-weight:700}
#tipsbox{position:absolute;right:8px;top:62px;width:min(92vw,380px);max-height:60vh;overflow:auto;z-index:5;background:#fffdf3;border:3px solid #e0b400;border-radius:18px;padding:10px 14px;box-shadow:0 6px 24px #0003;font-size:1.1rem;line-height:1.4}
#tipsbox[hidden]{display:none}#tipsbox .tipshead{display:flex;justify-content:space-between;align-items:center}#tipsbox .tipshead button{min-width:44px;min-height:44px;font-size:1.1rem;border-radius:12px;border:2px solid #ccc;background:#fff}
#tipsbox ol{margin:6px 0;padding-left:0;list-style:none;counter-reset:st}#tipsbox li{counter-increment:st;margin:8px 0}#tipsbox li::before{content:"Step " counter(st) ": ";font-weight:800;color:#4b2fd1}.fbtips{text-align:left;margin:4px 0 8px}.spbtn.help{background:#e6f7ff;border-color:#59b}.tipsnote{margin:4px 0 0;font-weight:700;color:#2a8a3a}
#padconfirm{position:absolute;left:50%;top:30%;transform:translateX(-50%);background:#fff;border:3px solid #4b2fd1;border-radius:18px;padding:16px;text-align:center;font-size:1.2rem;font-weight:700;box-shadow:0 6px 24px #0003}
#padconfirm button{min-height:48px;font-size:1.1rem;margin:8px 4px 0;padding:0 16px;border-radius:12px;border:2px solid #ccc;background:#fff}
#savewarn{position:sticky;top:0;z-index:60;background:#ffe08a;color:#5a3b00;font-weight:700;text-align:center;padding:10px;border-radius:0 0 14px 14px}
textarea{font:inherit;font-size:14px;width:100%;border-radius:12px;border:2px solid #6c4cf1;padding:8px;word-break:break-all;-webkit-user-select:text;user-select:text}
.note{background:#fff3c4}
#tutor{position:fixed;inset:0;z-index:70;background:#fffdf5;overflow:auto;padding:env(safe-area-inset-top) 12px 30px;overscroll-behavior:none}
.ttop{display:flex;justify-content:space-between;align-items:center;font-size:22px;padding:6px 0}.ttop button{min-height:60px;padding:0 16px;background:#ffe3e3;font-size:20px}
.ttabs{display:flex;gap:8px}.ttabs button{flex:1;background:#e0d7ff;font-size:19px;min-height:60px}.ttabs button.on{background:#6c4cf1;color:#fff}
.tbody{max-width:640px;margin:auto}.tgrid{margin:12px auto;border-collapse:collapse;font-size:34px;font-family:ui-monospace,Menlo,monospace}
.tgrid th{font-size:12px;color:#666;font-weight:normal;padding:0 4px}.tgrid td{width:52px;height:52px;text-align:center;border:1px solid #eee}
.tgrid .mark td{font-size:22px;color:#c2410c;height:30px}.tgrid .ans td{border-top:4px solid #222;color:#1d4ed8;font-weight:bold}.tgrid td.op{border:0;width:30px}
.tgrid .cur{background:#fff3b0}.tgrid th.cur{background:#ffd23f;color:#222;font-weight:bold}.tgrid td.x{text-decoration:line-through;color:#999}
.tprompt{font-size:24px;text-align:center;font-weight:bold}.tstep{text-align:center;color:#6c4cf1;margin:0}.tnote{background:#fff3c4;padding:8px;border-radius:12px}
.tin{font-size:36px;text-align:center;min-height:56px;border:3px solid #6c4cf1;border-radius:14px;background:#fff;margin:6px 0}
.tkeys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tkeys.yn{grid-template-columns:1fr 1fr}.tk{font-size:30px;background:#ffd23f;min-height:64px}
.fb .right{color:#1d7a36;font-size:22px}.fb .wrong{color:#a33;font-size:22px}.tline{font-size:22px;margin:6px 0}
.blocks{background:#fff;border-radius:14px;padding:8px;margin:8px 0}.blocks div{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.bh{width:50px;height:50px;background:#f59e0b;border:2px solid #b45309;background-image:linear-gradient(#b4530955 1px,transparent 1px),linear-gradient(90deg,#b4530955 1px,transparent 1px);background-size:5px 5px}
.bt{width:8px;height:50px;background:#22c55e;border:1px solid #15803d}.bo{width:10px;height:10px;background:#3b82f6;border:1px solid #1e40af}
.nline{font-size:24px;text-align:center;background:#fff;border-radius:14px;padding:10px}.nline span{font-weight:bold;color:#1d4ed8}
.tutbtn{border-color:#0e9f6e;background:#e6fff4;color:#065f46}
body.padopen{overflow:hidden;position:fixed;width:100%}
/* Phase 5: learner-friendly UI */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#padbar button,#padtop .close,#padtop .tipsbtn,#tipsbox .tipshead button,#padconfirm button{min-height:60px;min-width:60px}
.say{display:block;width:100%;margin:8px 0;padding:10px;font-size:22px;background:#fff3b0;color:#5a4300;border:3px solid #e0b400}
.tipshead .say{display:inline-block;width:auto;margin:0 6px 0 auto;padding:0 12px;font-size:1.1rem;border-radius:12px}
.mascot{display:flex;align-items:center;gap:10px;margin:8px auto;max-width:520px}.mbody{font-size:56px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
.mascot.happy .mbody{animation:hop .7s ease-in-out 3}
.bubble{position:relative;flex:1;margin:0;background:#fff;border:3px solid #6c4cf1;border-radius:20px;padding:10px 14px;font-size:22px;font-weight:bold;color:#3b2a8a}
.bubble:before{content:"";position:absolute;left:-14px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:8px solid #6c4cf1;border-left:0;width:0;height:0;border-width:8px 14px 8px 0}
@keyframes bob{50%{transform:translateY(-6px)}}@keyframes hop{50%{transform:translateY(-18px) scale(1.1)}}
.pathwrap{margin:10px 0}.pathinfo{text-align:center;font-weight:bold;margin:4px 0}
.bar{height:20px;background:#eee4c8;border-radius:10px;overflow:hidden;margin:0 0 10px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#7bd389,#2f9e44)}
.grid.path{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.trail{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.trail polyline{fill:none;stroke:#c9b37a;stroke-width:6;stroke-dasharray:2 10;stroke-linecap:round;vector-effect:non-scaling-stroke}
.grid.path .day{position:relative;z-index:1;border-radius:50%;aspect-ratio:1;min-height:64px;padding:4px;font-size:17px;line-height:1.2;box-shadow:0 4px 0 #0002}
.day.here{outline:4px solid #6c4cf1;outline-offset:2px}.day .pin{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:28px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:90}
.confetti span{position:absolute;top:-30px;width:12px;height:18px;border-radius:3px;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{top:105vh;transform:rotate(720deg) translateX(40px)}}
.dayparty{text-align:center;background:linear-gradient(135deg,#fff3b0,#ffd6f0);border:4px solid #ff9f1c}.starburst{font-size:40px;margin:0;animation:pop 1s ease-out}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.chk{display:flex;align-items:center;gap:12px;font-size:22px;min-height:60px}.chk input{width:36px;height:36px;margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* high contrast */
body.hc{background:#fff;color:#000}body.hc h1,body.hc .step,body.hc .tstep{color:#000}
body.hc button{background:#fff!important;color:#000!important;border:4px solid #000!important}
body.hc button[disabled]{color:#555!important;border-style:dashed!important}body.hc .day.done,body.hc .correct{background:#c6f6c6!important}body.hc .wrong{background:#ffd0d0!important}
body.hc .card,body.hc .bubble,body.hc .ctx{background:#fff;border:3px solid #000;color:#000}body.hc .fb.right,body.hc .fb .right{color:#004d00}body.hc .fb.wrong,body.hc .fb .wrong{color:#8b0000}
body.hc .trail polyline{stroke:#000}body.hc .bar{border:2px solid #000}body.hc .bar span{background:#000}body.hc input,body.hc select{border-color:#000;color:#000}
body.hc .go{font-weight:bold}
</style></head><body><main id="app"></main>
<script src="content.js"></script><script src="tips.js"></script><script src="storage.js"></script><script src="tutor.js"></script><script src="skills.js"></script><script src="fun.js"></script><script src="app.js"></script></body></html>
